<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my first website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="page-shell">
        <section class="hero-card">
            <h1>hello internet</h1>
            <p>my name is shivan this is my first website</p>
        </section>

        <section class="grid">
            <article class="card">
                <h2>about me</h2>
                <p>i am a student in class 11th who loves to code and play games</p>
                <img src="hero-art.svg" alt="Example website screenshot" class="card-image">
            </article>

            <article class="card">
                <h2>my hobbies</h2>
                <ul>
                    <li>playing cricket</li>
                    <li>playing football</li>
                    <li>playing video games</li>
                </ul>
            </article>

            <article class="card">
                <h2>my favorite websites</h2>
                <ol>
                    <li><a href="https://www.google.com" target="_blank" rel="noopener">Google</a></li>
                    <li><a href="https://www.youtube.com" target="_blank" rel="noopener">YouTube</a></li>
                    <li><a href="https://www.wikipedia.org" target="_blank" rel="noopener">Wikipedia</a></li>
                </ol>
            </article>
        </section>
    </main>
</body>

</html>
